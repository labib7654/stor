<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتجر - لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
  <div class="layout">
    <main class="main">
      <div class="page-header">
        <div>
          <div class="eyebrow">Store</div>
          <h1>المتجر</h1>
        </div>
        <button class="btn" id="newProductBtn">+ منتج جديد</button>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="label" style="margin-bottom:10px;">الأقسام</div>
        <div id="categoriesList" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;"></div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newCategoryName" placeholder="اسم قسم جديد" style="flex:1;" />
          <button class="btn" id="addCategoryBtn">إضافة قسم</button>
        </div>
      </div>

      <div class="card hidden" id="productForm" style="margin-bottom:20px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          <input type="text" id="pName" placeholder="اسم المنتج" />
          <input type="number" id="pPrice" placeholder="السعر" />
        </div>
        <select id="pCategory" style="margin-bottom:10px; width:100%;">
          <option value="">بدون قسم</option>
        </select>
        <textarea id="pDesc" rows="2" placeholder="وصف مختصر" style="margin-bottom:10px;"></textarea>
        <div style="margin-bottom:10px;">
          <label class="label" style="display:block; margin-bottom:6px;">صورة المنتج (اختياري)</label>
          <input type="file" id="pImageFile" accept="image/*" />
          <img id="pImagePreview" class="hidden" style="max-width:120px; margin-top:8px; border-radius:4px; display:block;" />
          <input type="hidden" id="pImageUrl" />
        </div>
        <div class="action-row">
          <button class="btn" id="saveProductBtn">حفظ</button>
          <button class="btn secondary" id="cancelProductBtn">إلغاء</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>الصورة</th>
            <th>المنتج</th>
            <th>القسم</th>
            <th>السعر</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
      <div class="empty-state hidden" id="emptyState">ما فيه منتجات بعد</div>

      <div class="page-header" style="margin-top:36px;">
        <div>
          <div class="eyebrow">Comments</div>
          <h1 style="font-size:20px;">تعليقات الزوار</h1>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>المنتج</th>
            <th>الاسم</th>
            <th>التعليق</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="commentsBody"></tbody>
      </table>
      <div class="empty-state hidden" id="emptyCommentsState">ما فيه تعليقات بعد</div>
    </main>
  </div>

  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/store.js"></script>
  <script>renderNav('store');</script>
</body>
</html>
