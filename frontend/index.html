<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظرة عامة - لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
  <div class="layout">
    <main class="main">
      <div class="page-header">
        <div>
          <div class="eyebrow">Overview</div>
          <h1>نظرة عامة</h1>
        </div>
      </div>

      <div class="grid" id="statsGrid">
        <div class="card"><div class="label">عدد المستخدمين</div><div class="value" id="statUsers">—</div></div>
        <div class="card"><div class="label">محظورين</div><div class="value danger" id="statBanned">—</div></div>
        <div class="card"><div class="label">الطلبات</div><div class="value amber" id="statOrders">—</div></div>
        <div class="card"><div class="label">حالة البوت</div><div class="value teal" id="statBotStatus">—</div></div>
      </div>

      <div class="card">
        <div class="label" style="margin-bottom:14px;">إذاعة رسالة لكل المستخدمين الغير محظورين</div>
        <textarea id="broadcastText" rows="4" placeholder="اكتب الرسالة..."></textarea>
        <div style="margin-top:12px;" class="action-row">
          <button class="btn" id="sendBroadcastBtn">إرسال للجميع</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/dashboard.js"></script>
  <script>renderNav('overview');</script>
</body>
</html>
