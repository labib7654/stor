<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box {
      width: 340px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
    }
    .login-box h1 { font-size: 17px; margin: 0 0 4px; }
    .login-box .sub { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .msg { font-size: 12px; color: var(--teal); min-height: 16px; margin-top: 10px; }
    .msg.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>لوحة التحكم</h1>
    <div class="sub">دخول عبر الإيميل وكلمة المرور</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn" id="loginBtn" style="width:100%">دخول</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <script src="/admin/js/config.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      msg.className = 'msg';
      msg.textContent = 'جاري التحقق...';
      loginBtn.disabled = true;

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          window.location.href = '/admin/index.html';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'صار خطأ، حاول مرة ثانية';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'تعذر الاتصال بالسيرفر';
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
